<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login MyResume</title>

    <link rel="stylesheet" href="style.css"> <!--link conector do CSS-->

</head>

<body>
<!--Fazer login-->
    <main class="container">

        <section class="card">
            <!--Entrar na conta-->
            <section class="logo">
            <img src="imagens-myresume/logo-myresume.png" alt="logo">
            </section>

            <h1>Entre no MyResume</h1>
            
            <p class="subtitle">
                Acesse sua conta
            </p>
            <!--formulário-->
            <form id="loginForm">

                <label for="email"> <!--colocar seu email-->
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="senha"><!--colocar sua senha-->
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit"> <!--enviar seus dados-->
                    Entrar
                </button>
                <br>

            </form>

            <p class="link-text">
                Ainda não possui uma conta?
                <a href="cadastro.html"> <!--link que envia para a pagina de cadastro novamente-->
                    Criar conta
                </a>
            </p>

            <p id="mensagem"></p> <!--enviar sua mensagem-->


        </section>

    </main>

    <
    

</body>

</html>
